  }
  function open(raw) {
    return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt'])
      .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(D.iv) }, k, bytes(D.data)); })
      .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
  }
  function start(p) { // entschlüsselte Seite einsetzen: Styles, Aufbau, dann die Skripte der Reihe nach
    var st = document.createElement('style'); st.textContent = p.css; document.head.appendChild(st);
    gate.remove();
    var holder = document.createElement('div'); holder.innerHTML = p.body;
    while (holder.firstChild) document.body.appendChild(holder.firstChild);
    p.js.forEach(function (s) { var el = document.createElement('script'); el.textContent = s.code + '\n//# sourceURL=' + s.f; document.body.appendChild(el); });
  }
  var saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) {
    gate.style.visibility = 'hidden';
    open(bytes(saved)).then(start).catch(function () { try { localStorage.removeItem(KEY); } catch (e) {} gate.style.visibility = ''; inp.focus(); });
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    btn.disabled = true; err.textContent = '';
    var raw;
    derive(inp.value.trim()).then(function (r) { raw = r; return open(r); })
      .then(function (p) { try { localStorage.setItem(KEY, b64(raw)); } catch (e) {} start(p); })
      .catch(function () { btn.disabled = false; err.textContent = 'Wrong password – try again.'; inp.select(); });
  });
  if (!saved) setTimeout(function () { inp.focus(); }, 50);
})();
</script>
